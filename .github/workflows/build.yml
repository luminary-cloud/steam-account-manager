name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Windows x64 Release
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Fetch vendored dependencies
        shell: pwsh
        run: ./scripts/init_third_party.ps1

      - name: Build
        shell: pwsh
        run: |
          msbuild steam-account-manager.sln `
            /m `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /verbosity:minimal `
            /nologo

      - name: Verify HWID DLL
        shell: pwsh
        run: |
          $dll = "build/Release/hwid_spoofer.dll"
          if (-not (Test-Path $dll)) {
              Write-Error "Build did not produce $dll"
              exit 1
          }
          Get-Item $dll | Format-List Length, LastWriteTime

      - name: Verify binary
        shell: pwsh
        run: |
          $exe = "build/Release/steam-account-manager.exe"
          if (-not (Test-Path $exe)) {
              Write-Error "Build did not produce $exe"
              exit 1
          }
          Get-Item $exe | Format-List Length, LastWriteTime

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: steam-account-manager-Release-x64
          path: build/Release/steam-account-manager.exe
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-2022

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Release artifact
        uses: actions/download-artifact@v4
        with:
          name: steam-account-manager-Release-x64
          path: dist

      - name: Stage zip
        shell: pwsh
        run: |
          Copy-Item LICENSE  dist/LICENSE.txt
          Copy-Item README.md dist/README.md
          Compress-Archive `
              -Path dist/steam-account-manager.exe, dist/LICENSE.txt, dist/README.md `
              -DestinationPath dist/steam-account-manager-${{ github.ref_name }}-x64.zip `
              -Force

      - name: Compute checksums
        shell: pwsh
        run: |
          (Get-FileHash dist/steam-account-manager.exe -Algorithm SHA256).Hash.ToLower() `
              | Out-File -NoNewline -Encoding ASCII dist/steam-account-manager.exe.sha256
          (Get-FileHash dist/steam-account-manager-${{ github.ref_name }}-x64.zip -Algorithm SHA256).Hash.ToLower() `
              | Out-File -NoNewline -Encoding ASCII dist/steam-account-manager-${{ github.ref_name }}-x64.zip.sha256

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/steam-account-manager.exe
            dist/steam-account-manager.exe.sha256
            dist/steam-account-manager-${{ github.ref_name }}-x64.zip
            dist/steam-account-manager-${{ github.ref_name }}-x64.zip.sha256
          generate_release_notes: true
          draft: false
          fail_on_unmatched_files: true
